name: Hostinger Fast ZIP Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🚀 Build & Ultra-Fast Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🏗️ Build Site & Pre-render Static Pages
        run: |
          cd frontend
          npm run build

      - name: 🗜️ Package into Fast Deploy ZIP (with .htaccess)
        run: |
          # 1. Generate unique deployment secret for this run
          DEPLOY_SECRET=$(openssl rand -hex 16)
          echo "DEPLOY_SECRET=$DEPLOY_SECRET" >> $GITHUB_ENV

          # 2. Create staging directory
          mkdir -p staging

          # 3. Zip all files and folders from frontend/dist (including dotfiles like .htaccess)
          cd frontend/dist
          shopt -s dotglob
          zip -r ../../staging/deploy.zip *
          cd ../..

          # 4. Copy extraction script and inject secret token
          cp .github/scripts/deploy_extract.php staging/deploy_extract.php
          sed -i "s/DEPLOY_SECRET_KEY/$DEPLOY_SECRET/g" staging/deploy_extract.php

          echo "✅ Deployment package prepared in staging/:"
          ls -lh staging/

      - name: 📤 FTP Upload ZIP to Hostinger (Only 2 Files, ~5 Seconds!)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          local-dir: ./staging/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false

      - name: ⚡ Trigger Server Unpack & Clean Up Archive
        run: |
          echo "Waiting 3 seconds for file system sync..."
          sleep 3

          echo "Triggering deploy_extract.php on Hostinger..."
          RESPONSE=$(curl -k -s -S -L --max-time 120 "https://steelmanufacturer.in/deploy_extract.php?secret=${DEPLOY_SECRET}")
          echo "Server Response: $RESPONSE"

          if [[ "$RESPONSE" == *"success"* ]]; then
            echo "🎉 Extraction successful! All 2,300+ pages deployed instantly on Hostinger."
          else
            echo "❌ Extraction failed or script was not reachable."
            echo "------------------------------------------------------"
            echo "Troubleshooting Tips:"
            echo "1. If you got a 404 error, check your FTP account path in Hostinger:"
            echo "   - If your FTP account lands in /public_html, server-dir './' works."
            echo "   - If using Hostinger Master FTP account, add a GitHub Secret: FTP_SERVER_DIR = public_html/"
            echo "2. Check if PHP ZipArchive is enabled in Hostinger PHP extensions."
            echo "------------------------------------------------------"
            exit 1
          fi

      - name: 🌐 Verify Website Health
        run: |
          HTTP_STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" https://steelmanufacturer.in/)
          echo "HTTP Status for https://steelmanufacturer.in/: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ]; then
            echo "✅ Website is live and healthy!"
          else
            echo "⚠️ Website returned HTTP $HTTP_STATUS"
          fi
