<text x="100" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9ca3af">OD 25.40 x 1.65 wall</text>
<text x="100" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffc107">Bore 22.10 mm</text>
<circle cx="300" cy="150" r="56.13" fill="#ffc107" fill-opacity="0.16" stroke="#ffc107" stroke-width="1.5"/>
<circle cx="300" cy="150" r="61.40" fill="none" stroke="#cfd5dd" stroke-width="10.55"/>
<text x="300" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f3f4f6">3/4 in Sch 10S pipe</text>
