<circle cx="100" cy="150" r="55.25" fill="#ffc107" fill-opacity="0.16" stroke="#ffc107" stroke-width="1.5"/>
<circle cx="100" cy="150" r="59.38" fill="none" stroke="#cfd5dd" stroke-width="8.25"/>
