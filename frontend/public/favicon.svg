<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
  </defs>

  <!-- Dark obsidian circular background -->
  <circle cx="256" cy="256" r="240" fill="#0D1117" stroke="url(#goldGrad)" stroke-width="20" />

  <!-- Inner accent flange ring -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#FFC107" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="12 8" />

  <!-- 8 Industrial Flange Bolt Dots -->
  <g fill="url(#goldGrad)">
    <circle cx="478" cy="256" r="7" />
    <circle cx="413" cy="413" r="7" />
    <circle cx="256" cy="478" r="7" />
    <circle cx="99" cy="413" r="7" />
    <circle cx="34" cy="256" r="7" />
    <circle cx="99" cy="99" r="7" />
    <circle cx="256" cy="34" r="7" />
    <circle cx="413" cy="99" r="7" />
  </g>

  <!-- Monogram SF -->
  <text x="256" y="278" 
        text-anchor="middle" 
        dominant-baseline="central" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="220" 
        letter-spacing="-6"
        fill="url(#goldGrad)">SF</text>
</svg>